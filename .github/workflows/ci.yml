name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner only
        run: python -m pip install --upgrade pip pytest
      - name: Run tests (no network, no credentials)
        run: python -m pytest -q
      - name: Run offline demo against the mock
        run: python examples/demo_offline.py
      - name: Run webhook intake demo
        run: python examples/demo_webhooks.py
      - name: Run attribution demo
        run: python examples/demo_attribution.py
      - name: Run attribution case study
        run: python examples/case_lead_attribution.py
