[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghl-automation-engine"
version = "0.1.0"
description = "HighLevel integration engine that cannot silently lie to your agent: typed client, idempotent webhooks, governed MCP tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hamid" }]
keywords = ["gohighlevel", "highlevel", "crm", "automation", "mcp", "webhooks"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghl-mock = "ghl_mock.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
